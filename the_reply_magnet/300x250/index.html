<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.orientation" content="portrait,landscape">
    <meta name="google" content="notranslate">
    <title>300x250 Banner - The Reply Magnet</title>

    <!-- Required Google Ads clickTag definition -->
    <script type="text/javascript">
        var clickTag = "https://gemini.google/id/students/?hl=id";
    </script>

    <!-- Official Google Ads Exit API Script -->
    <script src="https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js" type="text/javascript"></script>

    <script src="js/gsap.min.js"></script>
    <script src="js/TextPlugin.min.js"></script>

    <style>
        @font-face {
            font-family: "Google Sans Flex";
            src: url("assets/google-sans-flex.woff2") format("woff2");
            font-weight: 100 1000;
            font-style: normal;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        .ads-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 300px;
            height: 250px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(0deg, #15387A 0%, #121113 13%);
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .logo {
            flex-shrink: 0;
            margin-bottom: 7.9px;
            width: 120px;
        }

        .main-title {
            flex-shrink: 0;
            margin-bottom: 9.6px;
            width: 270px;
            font-variation-settings: "opsz" 144, "wdth" 37, "wght" 700, "GRAD" 37, "ROND" 0, "slnt" 0;
            text-align: center;
            font-size: 36px;
            line-height: 0.95;
        }

        .main-title span { display: block; }
        .line-blue, .text-blue-part { color: #027FFD; }
        .line-white, .text-white-part { color: #fff; }

        .content-stage {
            /* Prompt and result share this stage during the crossfade. */
            position: relative;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
            width: 250px;
            height: 120px;
        }

        .prompt-box {
            position: relative;
            width: 250px;
            visibility: hidden;
        }

        .prompt-text-container {
            position: absolute;
            top: 43px;
            left: 15px;
            width: 222px;
            font-size: 13px;
            line-height: 1.2;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            margin-left: 2px;
            vertical-align: middle;
            background: #027FFD;
            animation: blink 0.8s 36;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .image-card {
            /* The result replaces the prompt in the same space. */
            position: absolute;
            top: 0;
            width: 120px;
            height: 120px;
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; }
        }
        .link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="ads-container" aria-label="Google Gemini: Bikin wacana terlaksana">
        <div class="logo">
            <img src="assets/gemini-logo.png" alt="Google Gemini" width="400" height="57" loading="lazy">
        </div>

        <div class="main-title" id="mainTitle">
            <span class="line-blue">BIKIN WACANA</span>
            <span class="line-white">TERLAKSANA</span>
        </div>

        <div class="content-stage">
            <div class="prompt-box" id="promptBox" aria-hidden="true">
                <img src="assets/prompt-box.png" alt="" width="600" height="288" loading="lazy">
                <div class="prompt-text-container">
                    <span class="text-blue-part" id="typedBlue"></span><span class="text-white-part" id="typedWhite"></span><span class="cursor"></span>
                </div>
            </div>

            <div class="image-card" id="imageCard">
                <img src="assets/result-img.png" alt="Meme kucing berkacamata dengan ajakan bermain bola dan makan gorengan" id="mainImg" width="500" height="500" loading="lazy">
            </div>
        </div>

        <a class="link" href="https://gemini.google/id/students/?hl=id" target="_blank" rel="noopener noreferrer" aria-label="Coba Google Gemini"></a>
    </div>

    <script>
        if (window.gsap && window.TextPlugin && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            gsap.registerPlugin(TextPlugin);

            const timeline = gsap.timeline({
                defaults: { ease: "power3.out" },
                repeat: 4,
                repeatDelay: 2.5,
                onComplete: () => gsap.set(".cursor", { animation: "none", opacity: 0 })
            });

            timeline
                .set("#mainTitle", { opacity: 0, y: 12 })
                .set("#promptBox", { autoAlpha: 0 })
                .set("#typedBlue, #typedWhite", { text: "" })
                .set("#imageCard", { autoAlpha: 0, y: 24 })
                .to("#mainTitle", { opacity: 1, y: 0, duration: 0.8 })
                .to("#promptBox", { autoAlpha: 1, duration: 0.3 })
                .to("#typedBlue", { text: "Bikin meme kucing, ", duration: 0.5, ease: "none" })
                .to("#typedWhite", { text: "tulisannya: “Datang buat bola. Stay buat gorengan. Gas?”", duration: 0.5, ease: "none" })
                .to("#promptBox", { autoAlpha: 0, duration: 0.3 }, "+=1")
                .fromTo("#imageCard", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3 }, "<");
        }

        document.querySelector(".link").addEventListener("click", (event) => {
            if (window.ExitApi && typeof window.ExitApi.exit === "function") {
                event.preventDefault();
                window.ExitApi.exit();
            }
        });
    </script>
</body>
</html>
