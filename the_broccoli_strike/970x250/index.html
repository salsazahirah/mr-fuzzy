<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.orientation" content="landscape">
    <meta name="ad.size" content="width=970,height=250">
    <meta name="google" content="notranslate">
    <title>970x250 Banner - The Broccoli Strike</title>

    <!-- Required Google Ads clickTag definition -->
    <script>
        var clickTag = "https://gemini.google/id/students/?hl=id";
    </script>

    <!-- Official Google Ads Exit API Script -->
    <script src="https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js"></script>
    <script src="js/gsap.min.js"></script>
    <script src="js/TextPlugin.min.js"></script>

    <style>
        @font-face {
            font-family: "Google Sans Flex";
            src: url("assets/google-sans-flex.woff2") format("woff2");
            font-weight: 100 1000;
            font-style: normal;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        .ads-container {
            display: flex;
            align-items: center;
            gap: 1px;
            padding: 0 39px;
            position: relative;
            width: 970px;
            height: 250px;
            overflow: hidden;
            background: linear-gradient(0deg, #15387A 0%, #121113 32%);
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .brand-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            width: 365px;
            margin-top: 11px;
        }

        .logo {
            width: 180px;
            margin-left: -5px;
        }

        .main-title {
            width: 365px;
            font-variation-settings: "opsz" 144, "wdth" 37, "wght" 700, "GRAD" 37, "ROND" 0, "slnt" 0;
            text-align: center;
            font-size: 56px;
            line-height: 1;
        }

        .main-title span {
            display: block;
            white-space: nowrap;
        }

        .line-blue, .text-blue-part { color: #027FFD; }
        .line-white, .text-white-part { color: #fff; }

        .prompt-box {
            position: relative;
            flex-shrink: 0;
            width: 260px;
        }

        .prompt-box > img {
            height: 100%;
        }

        .prompt-text-container {
            position: absolute;
            top: 42px;
            left: 14px;
            width: 232px;
            font-size: 14px;
            line-height: 1.2;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            margin-left: 2px;
            vertical-align: middle;
            background: #027FFD;
            animation: blink 0.8s 36;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .image-card {
            flex-shrink: 0;
            margin-left: 34px;
            width: 190px;
            height: 190px;
            overflow: hidden;
            border-radius: 18px;
        }

        .link {
            position: absolute;
            inset: 0;
            z-index: 1;
            cursor: pointer;
        }

        .link:focus-visible {
            outline: 2px solid #4285F4;
            outline-offset: -3px;
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; }
        }
    </style>
</head>
<body>
    <div class="ads-container" aria-label="Google Gemini: Menu biasa, jadi istimewa">
        <div class="brand-block">
            <div class="logo">
                <img src="assets/gemini-logo.png" alt="Google Gemini" width="400" height="57">
            </div>

            <div class="main-title" id="mainTitle">
                <span class="line-blue">MENU BIASA</span>
                <span class="line-white">JADI ISTIMEWA</span>
            </div>
        </div>

        <div class="prompt-box" id="promptBox" aria-hidden="true">
            <img src="assets/prompt-box.png" alt="" width="600" height="288">
            <div class="prompt-text-container">
                <span class="text-blue-part" id="typedBlue">Kasih ide menu mengolah brokoli </span><span class="text-white-part" id="typedWhite">yang disukai anak</span><span class="cursor" id="cursor"></span>
            </div>
        </div>

        <div class="image-card" id="imageCard">
            <img src="assets/result-img.png" alt="Ide menu brokoli untuk anak dalam kotak bekal" id="mainImg" width="500" height="500">
        </div>

        <a class="link" href="https://gemini.google/id/students/?hl=id" target="_blank" rel="noopener noreferrer" aria-label="Coba Google Gemini"></a>
    </div>

    <script>
        if (window.gsap && window.TextPlugin && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            gsap.registerPlugin(TextPlugin);

            // 2.8 seconds of animation, then hold for 2.5 seconds.
            const introTl = gsap.timeline({
                defaults: { ease: "power3.out" },
                repeat: 4,
                repeatDelay: 2.5,
                onComplete: () => gsap.set(".cursor", { animation: "none", opacity: 0 })
            });

            introTl
                .set("#typedBlue, #typedWhite", { text: "" })
                .set("#mainTitle", { opacity: 0, y: 20 })
                .set("#promptBox", { autoAlpha: 0 })
                .set("#imageCard", { autoAlpha: 0, y: 24 })
                .to("#mainTitle", { opacity: 1, y: 0, duration: 1 })
                .to("#promptBox", { autoAlpha: 1, duration: 0.3 })
                .to("#typedBlue", { text: "Kasih ide menu mengolah brokoli ", duration: 0.5, ease: "none" })
                .to("#typedWhite", { text: "yang disukai anak", duration: 0.5, ease: "none" })
                .to("#imageCard", { autoAlpha: 1, y: 0, duration: 0.3 }, "+=0.2");
        }

        document.querySelector(".link").addEventListener("click", (event) => {
            if (window.ExitApi && typeof window.ExitApi.exit === "function") {
                event.preventDefault();
                window.ExitApi.exit();
            }
        });
    </script>
</body>
</html>
