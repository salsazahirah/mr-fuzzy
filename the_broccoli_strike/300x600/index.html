<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.orientation" content="portrait,landscape">
    <meta name="google" content="notranslate" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>300x600 Banner</title>

    <!-- Required Google Ads clickTag definition -->
    <script type="text/javascript">
        var clickTag = "https://gemini.google/id/students/?hl=id";
    </script>

    <!-- Official Google Ads Exit API Script -->
    <script src="https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js" type="text/javascript"></script>

    <script src="js/gsap.min.js"></script>
    <script src="js/TextPlugin.min.js"></script>
    
    <style>
        @font-face {
            font-family: "Google Sans Flex";
            src: url("assets/google-sans-flex.woff2") format("woff2");
            font-weight: 100 1000;
            font-style: normal;
        }
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;
        }
        a {
            color: inherit;
            text-decoration: inherit;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
        }
        .ads-container {
            display: flex;
            flex-direction: column;
            width: 300px;
            height: 600px;
            padding: 16px;
            gap: 16px;
            background: linear-gradient(0deg, #15387A 0%, #121113 13%);
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .logo {
            width: 150px;
        }

        .logo, .main-title, .prompt-box, .image-card {
            flex-shrink: 0;
        }

        .main-title {
            width: 266px;
            white-space: nowrap;
            font-variation-settings: "opsz" 144, "wdth" 37, "wght" 700, "GRAD" 37, "ROND" 0, "slnt" 0;
            text-align: center;
            font-size: 48px;
            line-height: 1;
        }

        .main-title .line-blue {
            color: #027FFD;
            display: block;
        }

        .main-title .line-white {
            color: #fff;
            display: block;
        }

        .prompt-box {
            width: 250px;
            position: relative;
        }

        .prompt-text-container {
            position: absolute;
            top: 40px;
            left: 14px;
            width: 222px;
            min-height: 40px;
            font-size: 13px;
            line-height: 1.35;
        }

        .text-blue-part {
            color: #027FFD;
        }

        .text-white-part {
            color: #fff;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background-color: #027FFD;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .image-card {
            width: 250px;
            height: 250px;
        }

        .link {
            position: absolute;
            inset: 0;
        }
    </style>
</head>
<body>
    <div class="ads-container">
        <div class="logo">
            <img src="assets/gemini-logo.png" alt="Google Logo" class="brand-logo" loading="lazy">
        </div>

        <div class="main-title" id="mainTitle">
            <span class="line-blue">MENU BIASA</span>
            <span class="line-white">JADI ISTIMEWA</span>
        </div>

        <div class="prompt-box" id="promptBox">
            <img src="assets/prompt-box.png" alt="" loading="lazy">
            <div class="prompt-text-container">
                <span class="text-blue-part" id="typedBlue"></span><span class="text-white-part" id="typedWhite"></span><span class="cursor" id="cursor"></span>
            </div>
        </div>

        <div class="image-card" id="imageCard">
            <img src="assets/result-img.png" alt="Gemini Result Image" class="main-img" id="mainImg" loading="lazy">
        </div>

        <div class="link"></div>
    </div>

  <script>
        gsap.registerPlugin(TextPlugin);
    
        const introTl = gsap.timeline({ defaults: { ease: "power3.out" } });
        introTl
            .from("#mainTitle", { opacity: 0, y: 20, duration: 1 })
            .from("#promptBox", { opacity: 0, duration: 0.3})
            .to("#typedBlue", { text: "Kasih ide menu mengolah brokoli ", duration: 0.5, ease: "none" })
            .to("#typedWhite", { text: "yang disukai anak", duration: 0.5, ease: "none" })
            .fromTo("#imageCard", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3 }, "+=0.2");
            
        function playLoopAnimation() {
            const loopTl = gsap.timeline({
                defaults: { ease: "power3.out" },
                onComplete: () => {
                    gsap.delayedCall(3, playLoopAnimation);
                }
            });
                
            loopTl
                .set("#typedBlue", { text: "" })
                .set("#typedWhite", { text: "" })
                .set("#imageCard", { autoAlpha: 0, y: 24 })

                .fromTo("#mainTitle", { opacity: 0, y: 20}, { opacity: 1, y: 0, duration: 1 })
                .fromTo("#promptBox", { opacity: 0 }, { opacity: 1, duration: 0.3 })
                .to("#typedBlue", { text: "Kasih ide menu mengolah brokoli ", duration: 0.5, ease: "none" })
                .to("#typedWhite", { text: "yang disukai anak", duration: 0.5, ease: "none" })
                .fromTo("#imageCard", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3 }, "+=0.2");
        }

        introTl.add(() => {
            playLoopAnimation();
        }, "+=3");

        document.querySelector(".link").addEventListener("click", () => {
            ExitApi.exit();
        });
    </script>
</body>
</html>
