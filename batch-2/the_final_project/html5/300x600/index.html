<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=300,height=600">
    <meta name="ad.orientation" content="portrait,landscape">
    <meta name="google" content="notranslate" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>300x600</title>
    <link rel="preload" href="assets/google-sans-flex.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Required Google Ads clickTag definition -->
    <script type="text/javascript">
        var clickTag = "https://gemini.google/about/";
    </script>


    <script src="js/gsap.min.js"></script>
    <script src="js/TextPlugin.min.js"></script>
    
    <style>
        @font-face {
            font-family: "Google Sans Flex";
            src: url("assets/google-sans-flex.woff2") format("woff2");
            font-weight: 100 1000;
            font-style: normal;
        }
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;
        }
        a {
            color: inherit;
            text-decoration: inherit;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
        }
        .ads-container {
            display: flex;
            flex-direction: column;
            width: 300px;
            height: 600px;
            padding: 16px;
            gap: 16px;
            background: url(assets/bg.jpg);
            background-size: cover;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .logo {
            width: 150px;
            position: relative;
        }

        .logo, .main-title, .prompt-box, .image-card {
            flex-shrink: 0;
        }

        .main-title {
            width: 266px;
            white-space: nowrap;
            font-variation-settings: "opsz" 144, "wdth" 37, "wght" 700, "GRAD" 37, "ROND" 0, "slnt" 0;
            text-align: center;
            font-size: 34px;
            line-height: 1;
        }

        .main-title .line-blue {
            color: #027FFD;
            display: block;
        }

        .main-title .line-white {
            color: #fff;
            display: block;
        }

        .prompt-box {
            width: 250px;
            position: relative;
            border-radius: 21px;
            overflow: hidden;
        }

        .prompt-textbox {
            width: 250px;
            height: 65px;
            position: relative;
            border-radius: 21px;
            overflow: hidden;
            background-color: #262829;
        }

        .prompt-text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 40px;
            font-size: 14px;
            line-height: 1.3;
            padding: 14px;
        }

        .text-blue-part {
            color: #027FFD;
        }

        .text-white-part {
            color: #fff;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 13px;
            background-color: #027FFD;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .image-card {
            width: 250px;
            height: 275px;
            border-radius: 20px;
            overflow: hidden;
        }

        .prompt-action {
            width: 250px;
            margin-top: 10px;
        }

        .link {
            position: absolute;
            inset: 0;
        }

        .fluid-wave {
            position: absolute;
            width: 80px;
            aspect-ratio: 1.8;
            border-radius: 36px;
            overflow: hidden;
            background: #010207;
            isolation: isolate;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            flex: none;
        }
        .fluid-wave::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                #000 0%, #000 28%, #010512 41%, #03133f 60%, #1141ae 84%, #1e67e9 100%);
        }
        .fluid-wave svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            overflow: hidden;
        }
        .fluid-wave .fw-front-track {
            transform-box: fill-box;
            animation: fw-slide-left 2.4s linear 12 forwards;
            will-change: transform;
        }
        .fluid-wave .fw-back-track {
            transform-box: fill-box;
            animation: fw-slide-right 2.4s linear 12 forwards;
            will-change: transform;
        }
        .fluid-wave .fw-front-bob {
            animation: fw-bob-front 2.4s ease-in-out 12 forwards;
        }
        .fluid-wave .fw-back-bob {
            animation: fw-bob-back 2.4s ease-in-out 12 forwards;
        }
        .fluid-wave .fw-breath {
            animation: fw-breathe 2.4s ease-in-out 12 forwards;
        }
        .fluid-wave::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom,
                #000 0%, #000 19%, rgba(0,0,0,.97) 28%,
                rgba(0,0,0,.75) 39%, rgba(0,0,0,.26) 55%, transparent 81%);
        }
        @keyframes fw-slide-left {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }
        @keyframes fw-slide-right {
            from { transform: translateX(-50%); }
            to   { transform: translateX(0); }
        }
        @keyframes fw-bob-front {
            0%, 100% { transform: translateY(0); }
            25%      { transform: translateY(-7px); }
            65%      { transform: translateY(7px); }
        }
        @keyframes fw-bob-back {
            0%, 100% { transform: translateY(0); }
            35%      { transform: translateY(8px); }
            78%      { transform: translateY(-7px); }
        }
        @keyframes fw-breathe {
            0%,100% { opacity: .72; }
            50%     { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            .fluid-wave .fw-front-track,
            .fluid-wave .fw-back-track,
            .fluid-wave .fw-front-bob,
            .fluid-wave .fw-back-bob,
            .fluid-wave .fw-breath { animation: none; }
        }
    </style>
</head>
<body>
    <div class="ads-container" aria-label="Google Gemini: Bikin sketsa filter air ini jadi diagram 3D yang jelas">
        <div class="bg-overlay" id="bgOverlay"></div>

        <div class="logo">
            <img src="assets/gemini-logo.png" alt="Google Logo" class="brand-logo" loading="lazy">
        </div>

        <div class="main-title" id="mainTitle">
            <span class="line-blue">SKETSA BERANTAKAN</span>
            <span class="line-white">JADI MUDAH DIJELASKAN</span>
        </div>
        
        <div class="image-card" id="imageCard">
            <img src="assets/result-img.jpg" alt="Diagram filter air dari hasil sketsa" class="main-img" id="mainImg" loading="lazy">
        </div>

        <div class="prompt-box" id="promptBox">
            <div class="prompt-textbox">    
                <div class="prompt-text-container">
                    <span class="text-white-part" id="typedIntro"></span><span class="text-blue-part" id="typedBlue"></span><span class="text-white-part" id="typedMiddle"></span><span class="text-blue-part" id="typedGarden"></span><span class="text-white-part" id="typedWhite"></span><span class="cursor" id="cursor"></span>
                </div>
            </div>
            <div class="prompt-action" id="promptAction">
                <img src="assets/action-btn.png" alt="">
            </div>
            <div class="fluid-wave" aria-hidden="true">
                <svg viewBox="0 0 360 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                    <linearGradient id="fw2-back-fill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#3eaeff" stop-opacity=".65"/>
                    <stop offset=".35" stop-color="#207aff" stop-opacity=".87"/>
                    <stop offset="1" stop-color="#0c33b9" stop-opacity=".93"/>
                    </linearGradient>
                    <linearGradient id="fw2-front-fill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#77d9ff" stop-opacity=".92"/>
                    <stop offset=".22" stop-color="#338dff" stop-opacity=".93"/>
                    <stop offset=".7" stop-color="#1858e3" stop-opacity=".99"/>
                    <stop offset="1" stop-color="#1240bd"/>
                    </linearGradient>
                    <filter id="fw2-haze" x="-8%" y="-30%" width="116%" height="160%">
                    <feGaussianBlur stdDeviation="13"/>
                    </filter>
                    <filter id="fw2-top-gaussian" x="-15%" y="-75%" width="130%" height="250%" color-interpolation-filters="sRGB">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="6 40"/>
                    </filter>
                </defs>
                <!-- One 360-unit period is repeated twice along each path. -->
                <g class="fw-back-bob">
                    <g class="fw-back-track">
                    <path d="M0 120 C60 84 120 84 180 120 C240 156 300 156 360 120 C420 84 480 84 540 120 C600 156 660 156 720 120 L720 240 L0 240 Z"
                            fill="#1e66ff" opacity=".8" filter="url(#fw2-haze)"/>
                    <path d="M0 120 C60 84 120 84 180 120 C240 156 300 156 360 120 C420 84 480 84 540 120 C600 156 660 156 720 120 L720 240 L0 240 Z"
                            fill="url(#fw2-back-fill)" filter="url(#fw2-top-gaussian)"/>
                    </g>
                </g>
                <g class="fw-front-bob">
                    <g class="fw-front-track">
                    <path d="M0 131 C60 83 120 83 180 131 C240 179 300 179 360 131 C420 83 480 83 540 131 C600 179 660 179 720 131 L720 240 L0 240 Z"
                            fill="#288cff" opacity=".8" filter="url(#fw2-haze)"/>
                    <path d="M0 131 C60 83 120 83 180 131 C240 179 300 179 360 131 C420 83 480 83 540 131 C600 179 660 179 720 131 L720 240 L0 240 Z"
                            fill="url(#fw2-front-fill)" filter="url(#fw2-top-gaussian)"/>
                    <g class="fw-breath">
                        <path d="M0 131 C60 83 120 83 180 131 C240 179 300 179 360 131 C420 83 480 83 540 131 C600 179 660 179 720 131"
                            fill="none" stroke="#7fd6ff" stroke-width="9" opacity=".72" filter="url(#fw2-haze)"/>
                    </g>
                    </g>
                </g>
                </svg>
            </div>
        </div>
        
        <a class="link" href="javascript:window.open(window.clickTag)"></a>
    </div>

  <script>
        gsap.registerPlugin(TextPlugin);
    
        const introTl = gsap.timeline({ defaults: { ease: "power3.out" } });
        introTl
            .from("#mainTitle", { opacity: 0, y: 20, duration: 1 })
            .from("#promptBox", { opacity: 0, duration: 0.3})
            .to("#typedIntro", { text: "Bikin ", duration: 0.1, ease: "none" })
            .to("#typedBlue", { text: "sketsa filter air", duration: 0.15, ease: "none" })
            .to("#typedMiddle", { text: " ini jadi ", duration: 0.15, ease: "none" })
            .to("#typedGarden", { text: "diagram 3D", duration: 0.2, ease: "none" })
            .to("#typedWhite", { text: " yang jelas.", duration: 0.4, ease: "none" })
            .set("#cursor", { animation: "none", opacity: 0 }, "+=0.1")
            .fromTo("#imageCard", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3 }, "+=0.1")
            .fromTo("#bgOverlay", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3}, "<");
            
        function playLoopAnimation(loop = 2) {
            const loopTl = gsap.timeline({
                defaults: { ease: "power3.out" },
                onComplete: () => {
                    if (loop < 3) {
                        gsap.delayedCall(3, () => playLoopAnimation(loop + 1));
                    }
                }
            });
                
            loopTl
                .set("#cursor", { animation: "blink 0.8s infinite", opacity: 1 })
                .set("#typedIntro, #typedBlue, #typedMiddle, #typedGarden, #typedWhite", { text: "" })
                .set("#imageCard", { autoAlpha: 0, y: 24 })

                .fromTo("#mainTitle", { opacity: 0, y: 20}, { opacity: 1, y: 0, duration: 1 })
                .fromTo("#promptBox", { opacity: 0 }, { opacity: 1, duration: 0.3 })
                .to("#typedIntro", { text: "Bikin ", duration: 0.1, ease: "none" })
                .to("#typedBlue", { text: "sketsa filter air", duration: 0.15, ease: "none" })
                .to("#typedMiddle", { text: " ini jadi ", duration: 0.15, ease: "none" })
                .to("#typedGarden", { text: "diagram 3D", duration: 0.2, ease: "none" })
                .to("#typedWhite", { text: " yang jelas.", duration: 0.4, ease: "none" })
                .set("#cursor", { animation: "none", opacity: 0 }, "+=0.1")
                .fromTo("#imageCard", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3 }, "+=0.1")
                .fromTo("#bgOverlay", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3}, "<");
        }

        introTl.add(() => {
            playLoopAnimation();
        }, "+=3");

    </script>
</body>
</html>
