<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=970,height=90">
    <meta name="ad.orientation" content="landscape">
    <meta name="google" content="notranslate">
    <title>The Lunchbox Universe — 970x90 Banner</title>
    <script>
        var clickTag = "https://gemini.google/id/students/?hl=id";
    </script>
    <script src="https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js"></script>
    <script src="js/gsap.min.js"></script>
    <script src="js/TextPlugin.min.js"></script>
    <style>
        @font-face {
            font-family: "Google Sans Flex";
            src: url("assets/google-sans-flex.woff2") format("woff2");
            font-weight: 100 1000;
            font-style: normal;
            font-display: block;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 970px;
            height: 90px;
            margin: 0;
            overflow: hidden;
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;
        }

        .ads-container {
            position: relative;
            display: block;
            width: 970px;
            height: 90px;
            padding: 0 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: linear-gradient(0deg, #15387a 0%, #121113 45%);
            color: #fff;
            text-decoration: none;
        }

        .brand-logo {
            position: absolute;
            left: 82px;
            top: 50%;
            transform: translateY(-50%);
            display: block;
            width: 170px;
            height: auto;
        }

        .main-title {
            position: absolute;
            left: 306px;
            top: 20px;
            margin: 0;
            font-family: "Google Sans Flex", sans-serif;
            font-optical-sizing: auto;
            font-variation-settings: "opsz" 144, "wdth" 37, "wght" 700, "GRAD" 37, "ROND" 0, "slnt" 0;
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        .line-blue {
            color: #1c70f9;
        }

        .line-white {
            color: #fff;
        }

        .content-stage {
            position: absolute;
            left: 306px;
            top: 8px;
            width: 580px;
            height: 72px;
        }

        .prompt-box {
            position: absolute;
            left: 0;
            top: 0;
            width: 480px;
            height: 72px;
            overflow: hidden;
            border-radius: 12px;
            visibility: hidden;
        }

        .prompt-background {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .prompt-text-container {
            position: absolute;
            inset: 0 18px;
            display: flex;
            align-items: center;
            font-size: 16px;
            line-height: 1.35;
        }

        .text-blue-part { color: #027ffd; }
        .text-white-part { color: #fff; }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            margin-left: 2px;
            vertical-align: middle;
            background: #027ffd;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .image-card {
            position: absolute;
            right: 0;
            top: 0;
            width: 72px;
            height: 72px;
            visibility: hidden;
        }

        .main-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; }
        }

        .ads-container:focus-visible {
            outline: 2px solid #fff;
            outline-offset: -3px;
        }
    </style>
</head>
<body>
    <a class="ads-container" href="https://gemini.google/id/students/?hl=id" target="_blank" rel="noopener noreferrer" aria-label="Google Gemini: Eksplor kreasi, langsung eksekusi">
        <img src="assets/gemini-logo.png" alt="Google Gemini" class="brand-logo" width="170" height="24">
        <h1 class="main-title" id="mainTitle"><span class="line-blue">EKSPLOR KREASI</span> <span class="line-white">LANGSUNG EKSEKUSI</span></h1>
    </a>
    <script>
        if (window.gsap && window.TextPlugin && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            gsap.registerPlugin(TextPlugin);

            // Wait for the local font so the headline starts at its intended size.
            document.fonts.ready.then(function () {
                const introTl = gsap.timeline({
                    defaults: { ease: "power3.out" },
                    repeat: -1,
                    repeatDelay: 3
                });

                introTl
                    .set("#mainTitle", { autoAlpha: 0, y: 20 })
                    .set("#typedBlue, #typedWhite", { text: "" })
                    .to("#mainTitle", { autoAlpha: 1, y: 0, duration: 0.6})
            });
        }

        document.querySelector(".ads-container").addEventListener("click", function (event) {
            if (window.ExitApi && typeof window.ExitApi.exit === "function") {
                event.preventDefault();
                window.ExitApi.exit();
            } else {
                this.href = window.clickTag;
            }
        });
    </script>
</body>
</html>
